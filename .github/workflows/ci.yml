name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (lint + race tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...

  web:
    name: Web UI (types + committed build is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc -b --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: internal/web/dist matches the source
        run: |
          git status --porcelain internal/web/dist
          test -z "$(git status --porcelain internal/web/dist)" || { echo "::error::run 'make web' and commit internal/web/dist"; exit 1; }

  platforms:
    name: Build + test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - name: Desktop app (Windows test build)
        if: runner.os == 'Windows'
        shell: bash
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o KuliDev.exe ./cmd/kulidev-desktop
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: kulidev-desktop-windows
          path: KuliDev.exe
          retention-days: 7
